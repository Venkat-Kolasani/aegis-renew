services:
  - type: web
    name: aegis-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash scripts/start_api.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      - key: PRAVA_SANDBOX_BASE_URL
        value: https://sandbox.api.prava.space
      - key: OPENAI_API_KEY
        sync: false
      - key: PRAVA_PUBLISHABLE_KEY
        sync: false
      - key: PRAVA_SECRET_KEY
        sync: false

databases:
  - name: aegis-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
